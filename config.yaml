  # --- Close-based trading (종가매매), daily bars ---------------------------
  # The four quietest names. Their intraday range barely clears the round trip,
  # so the move worth having is the overnight one -- and a smaller daily range
  # also means a smaller gap, which matters because NOTHING protects these
  # positions between the close and the next open. Kiwoom holds no resting
  # stop order and the bot is not running, so a gap through the stop is taken
  # in full at the opening auction.
  #
  # Entry is 15:15-15:19, the last continuous-trading minutes; the exit is the
  # next morning at 09:05, five minutes after the open, unconditionally.
  "460930":
    name: 현대힘스
    market: KOSDAQ
    enabled: true
    strategy: close_auction
    timeframe: 1Day
    min_qty: 1
    entry_window: ["15:15", "15:19"]
    force_exit_at: "09:05"
    hold_overnight: true
    params:
      trend_ema: 20
      volume_mult: 1.2
      close_strength: 0.7
      atr_trail_mult: 2.0

