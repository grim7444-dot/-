[project]
name = "trading-bot"
version = "0.1.0"
description = "암호화폐 자동 트레이딩 봇"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
trading-bot = "trading_bot.cli:main"
