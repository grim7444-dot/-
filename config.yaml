# ---------------------------------------------------------------------------
# KRX trading bot — configuration
#
# Nothing secret lives here. App keys and tokens are read from .env only.
# ---------------------------------------------------------------------------

account:
  # Used by the dry-run broker and as the backtest starting equity (KRW).
  # Update this to match your actual account equity before live trading.
  starting_equity: 550000
  currency: KRW

risk:
  # 청산 직후 같은 종목 재진입 금지 시간(분) -- 방금 매도한 저항선을
  # 바로 다시 쫓아 사는 것을 막는다.
  entry_cooldown_minutes: 15
  # Rule 4: every trade risks exactly this fraction of *current* equity.
  per_trade_pct: 0.02
  # Portfolio-wide caps. 1% x 8 stocks would put 8% at risk at once; these
  # hold total exposure to 6% across at most 6 open positions.
  max_total_risk_pct: 0.06
  max_open_positions: 6
  # Rule 5: peak-to-trough equity drawdown that trips the kill switch.
  max_drawdown_pct: 0.10
  atr_period: 14
  # Hard stop distance in ATR multiples. 1.0 => a 1-ATR adverse move loses
  # exactly per_trade_pct of equity.
  hard_stop_atr_mult: 1.0
  # Never let a single position exceed this share of equity in notional terms.
  max_position_notional_pct: 0.90
  # Retail short selling of KRX equities is not practically available, and
  # futures (including the futures inside inverse ETFs) are out of scope.
  # A short signal therefore closes a position but never opens one.
  long_only: true
  theme_filter:
    enabled: true

# Two stocks in one theme are one thesis sized twice, so only one position per
# theme is allowed at a time. Single-member themes never block anything.
themes:
  beauty: ["161890", "192820", "278470"]  # 한국콜마, 코스맥스, 에이피알
  construction: ["002990", "228340"]      # 금호건설, 동양파일 (건설 + PHC파일)
  # 금호타이어 shares a name with 금호건설 but not an owner: it was sold to
  # Doublestar in 2018. Tyres track the auto cycle, construction does not, so
  # they are deliberately separate themes.
  auto_parts: ["073240"]                  # 금호타이어
  power_energy: ["006340", "009830"]      # 대원전선, 한화솔루션
  battery_materials: ["093370", "247540", "086520", "003670"] # 후성, 에코프로비엠, 에코프로, 포스코퓨처엠
  shipbuilding: ["460930"]                # 현대힘스
  robotics: ["439960"]                    # 코스모로보틱스
  game: ["101730", "263750", "293490"]   # 위메이드맥스, 펄어비스, 카카오게임즈
  pharma: ["028300", "068270", "196170"] # HLB, 셀트리온, 알테오젠

# ---------------------------------------------------------------------------
# Universe
#
# `name` and `market` are for display and for tax/tick selection. Run
# `python main.py profile` with network access to verify them against the
# official listing data — a wrong `market` mis-prices the transaction tax.
# ---------------------------------------------------------------------------
universe:
  # --- Day trading (단타), 30-minute bars ----------------------------------
  # Assigned by measured volatility, not by sector: `profile` put these five
  # above the 8% daily-ATR line.
  #
  # The timeframe comes from `profile --atr-sweep`, which measured ATR at each
  # candidate. What matters is costs as a share of what a trade risks -- the
  # hard stop is one ATR, so that ratio is 0.38% / ATR%:
  #
  #     3Min 112%   5Min 72%   10Min 42%   15Min 32%   30Min 20%   60Min 12%
  #
  # A breakout system does not earn 0.42R a trade, so 30-minute bars are the
  # first that survive their own friction. This is still a day trade: entries
  # 09:15-14:30, flat at 15:10. There are 13 bars in a session, so signals are
  # much rarer than on a faster bar -- that is what the cost structure buys.
  #
  # entry_window keeps entries out of the opening minutes, where the spread is
  # widest and no channel has formed yet, and stops them well before the
  # flat-out. force_exit_at closes every position at 15:10, ten minutes before
  # the closing auction -- a position still open when the auction starts
  # cannot be sold at a predictable price and becomes an overnight hold.
  "009830":
    name: 한화솔루션
    market: KOSPI
    enabled: false  # 고정 종목 비활성 -- 스크리너가 매일 거래량 터진 종목으로 대체
    strategy: pullback_bounce
    timeframe: 3Min
    min_qty: 1
    entry_window: ["09:00", "11:00"]
    force_exit_at: "15:10"
    params:
      trend_ema: 20
      swing_lookback: 7
      pullback_bars: 2
      pullback_min_pct: 0.005
      min_bar_strength: 0.25
      stop_pct: 0.017
      arm_pct: 0.012
      lock_pct: 0.018
      peak_trail_pct: 0.005
      max_cost_share: 0.35

