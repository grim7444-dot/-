# ---------------------------------------------------------------------------
# KRX market rules
# ---------------------------------------------------------------------------
krx:
  # Daily price limit. At the limit there is no counterparty, so orders are
  # skipped rather than assumed filled.
  price_limit_pct: 0.30

  # Quote grid. VERIFY against the current KRX rulebook — these have been
  # revised before, and a stale ladder silently mis-prices every stop.
  tick_ladder:
    KOSPI:
      - {below: 2000, tick: 1}
      - {below: 5000, tick: 5}
      - {below: 20000, tick: 10}
      - {below: 50000, tick: 50}
      - {below: 200000, tick: 100}
      - {below: 500000, tick: 500}
      - {below: inf, tick: 1000}
    KOSDAQ:
      - {below: 2000, tick: 1}
      - {below: 5000, tick: 5}
      - {below: 20000, tick: 10}
      - {below: 50000, tick: 50}
      - {below: inf, tick: 100}

  # Non-trading weekdays. Weekends are excluded automatically; Korean public
  # holidays, substitute holidays and ad-hoc closures cannot be derived from a
  # rule and must be listed here. Refresh with:
  #     python main.py profile --refresh-calendar
  holidays: []

# ---------------------------------------------------------------------------
# Rule 11: cost assumptions live here and print with every result set.
#
# Unlike a US venue, the SELL side pays transaction tax on top of commission.
# VERIFY the current rates before trading — they have been cut in stages.
# ---------------------------------------------------------------------------
costs:
  commission_bps: 1.5          # broker commission, per side
  sell_tax_bps:                # transaction tax, SELL side only
    KOSPI: 15.0
    KOSDAQ: 15.0
  slippage_bps: 10.0           # small/mid caps slip more than index ETFs

# ---------------------------------------------------------------------------
# Kiwoom REST API
#
# Paths and api-id codes. VERIFY against https://openapi.kiwoom.com/ and the
# official examples before live trading.
# ---------------------------------------------------------------------------
kiwoom:
  endpoints: {}                # override DEFAULT_ENDPOINTS in broker.py
  api_ids: {}                  # override DEFAULT_API_IDS in broker.py

api:
  max_retries: 5
  backoff_base_seconds: 2.0
  backoff_max_seconds: 60.0
  timeout_seconds: 10.0
  # Kiwoom throttles TR calls, so requests are serialised at this rate.
  calls_per_second: 4.0

schedule:
  # How often the outer loop wakes to see which strategies are due.
  tick_seconds: 20
  intervals:
    10Min: 600
    30Min: 1800
    60Min: 3600
    # Daily strategies are looked at once a day for a *signal*. An open
    # position is re-checked every tick regardless -- see TradingEngine.
    # due_codes -- because the hard stop lives in the loop and nowhere else.
    1Day: 86400
  # How long to sleep when KRX is closed before re-checking.
  closed_market_sleep_seconds: 300

backtest:
  default_months: 6
  # Rule 10: fills happen on the bar *after* the signal bar.
  fill_delay_bars: 1
  respect_price_limits: true

# ---------------------------------------------------------------------------
# Daily theme screener
#
# Runs once at 09:00-09:10 each session. Fetches KOSDAQ/KOSPI top stocks by
# trading value, filters by ATR% and liquidity, and injects up to n_stocks
# into the scalping universe for the day. Stocks already in `universe` are
# never duplicated. Set enabled: false to use only the static universe.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# NXT (NextTrade ATS) pre-market configuration
#
# At 08:00-08:30, the bot wakes up, queries each scalping stock's current NXT
# price via Kiwoom, and compares it with the previous close. Stocks with a
# pre-market drop larger than bearish_threshold_pct are skipped for entries
# that day. Set enabled: false to disable the NXT scan entirely.
# ---------------------------------------------------------------------------
nxt:
  enabled: true
  # Skip long entries if NXT pre-market is down more than this vs prev close.
  # -0.01 = -1%. Leave positive (e.g. 0.0) to block neutral pre-markets too.
  bearish_threshold_pct: -0.01

screener:
  enabled: true
  n_stocks: 5               # max dynamic stocks to add per session
  markets: ["KOSDAQ", "KOSPI"]
  min_price: 3000           # skip sub-3000 KRW stocks (wide spreads)
  min_atr_pct: 0.015        # 1.5% daily ATR minimum (cost gate still applies)
  min_trading_value_m: 5000 # 5000억 KRW daily trading value minimum

telegram:
  # Rule 12: dry-run by default. A missing token prints a preview, not an error.
  dry_run: true
  parse_mode: Markdown

live_banner:
  countdown_seconds: 10

paths:
  trades_csv: trades.csv
  daily_pnl_csv: daily_pnl.csv
  state_file: state.json
  log_file: logs/bot.log
  cache_dir: data/cache
