    enabled: false  # 종가매매 비활성 — 갭하락 위험
    strategy: close_auction
    timeframe: 1Day
    min_qty: 1
    entry_window: ["15:15", "15:19"]
    force_exit_at: "09:05"
    hold_overnight: true
    params:
      trend_ema: 20
      volume_mult: 1.2
      close_strength: 0.7
      atr_trail_mult: 2.0

  "293490":
    name: 카카오게임즈
    market: KOSDAQ
    enabled: false  # 종가매매 비활성 — 갭하락 위험
    strategy: close_auction
    timeframe: 1Day
    min_qty: 1
    entry_window: ["15:15", "15:19"]
    force_exit_at: "09:05"
    hold_overnight: true
    params:
      trend_ema: 20
      volume_mult: 1.2
      close_strength: 0.7
      atr_trail_mult: 2.0

# ---------------------------------------------------------------------------
# KRX market rules
# ---------------------------------------------------------------------------
krx:
  # Daily price limit. At the limit there is no counterparty, so orders are
  # skipped rather than assumed filled.
  price_limit_pct: 0.30

  # Quote grid. VERIFY against the current KRX rulebook — these have been
  # revised before, and a stale ladder silently mis-prices every stop.
  tick_ladder:
    KOSPI:
      - {below: 2000, tick: 1}
      - {below: 5000, tick: 5}
      - {below: 20000, tick: 10}
      - {below: 50000, tick: 50}
      - {below: 200000, tick: 100}
      - {below: 500000, tick: 500}
      - {below: inf, tick: 1000}
    KOSDAQ:
      - {below: 2000, tick: 1}
      - {below: 5000, tick: 5}
      - {below: 20000, tick: 10}
      - {below: 50000, tick: 50}
      - {below: inf, tick: 100}

  # Non-trading weekdays. Weekends are excluded automatically; Korean public
  # holidays, substitute holidays and ad-hoc closures cannot be derived from a
  # rule and must be listed here. Refresh with:
  #     python main.py profile --refresh-calendar
  holidays: []

# ---------------------------------------------------------------------------
# Rule 11: cost assumptions live here and print with every result set.
#
# Unlike a US venue, the SELL side pays transaction tax on top of commission.
# VERIFY the current rates before trading — they have been cut in stages.
# ---------------------------------------------------------------------------
costs:
  commission_bps: 1.5          # broker commission, per side
  sell_tax_bps:                # transaction tax, SELL side only
    KOSPI: 15.0
    KOSDAQ: 15.0
  slippage_bps: 10.0           # small/mid caps slip more than index ETFs

# ---------------------------------------------------------------------------
# Kiwoom REST API
#
# Paths and api-id codes. VERIFY against https://openapi.kiwoom.com/ and the
# official examples before live trading.
# ---------------------------------------------------------------------------
kiwoom:
  endpoints: {}                # override DEFAULT_ENDPOINTS in broker.py
  api_ids: {}                  # override DEFAULT_API_IDS in broker.py

api:
  max_retries: 5
  backoff_base_seconds: 2.0
  backoff_max_seconds: 60.0
  timeout_seconds: 10.0
  # Kiwoom throttles TR calls, so requests are serialised at this rate.
  calls_per_second: 4.0

schedule:
  # How often the outer loop wakes to see which strategies are due.
  tick_seconds: 10
  intervals:
    3Min: 180
    10Min: 600
    30Min: 1800
    60Min: 3600
    # Daily strategies are looked at once a day for a *signal*. An open
    # position is re-checked every tick regardless -- see TradingEngine.
    # due_codes -- because the hard stop lives in the loop and nowhere else.
    1Day: 86400
  # How long to sleep when KRX is closed before re-checking.
  closed_market_sleep_seconds: 300

backtest:
  default_months: 6
  # Rule 10: fills happen on the bar *after* the signal bar.
  fill_delay_bars: 1
  respect_price_limits: true

# ---------------------------------------------------------------------------
# Daily theme screener
#
# Runs once at 09:00-09:10 each session. Fetches KOSDAQ/KOSPI top stocks by
# trading value, filters by ATR% and liquidity, and injects up to n_stocks
# into the scalping universe for the day. Stocks already in `universe` are
# never duplicated. Set enabled: false to use only the static universe.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# NXT (NextTrade ATS) pre-market configuration
#
# At 08:00-08:30, the bot wakes up, queries each scalping stock's current NXT
# price via Kiwoom, and compares it with the previous close. Stocks with a
# pre-market drop larger than bearish_threshold_pct are skipped for entries
# that day. Set enabled: false to disable the NXT scan entirely.
# ---------------------------------------------------------------------------
nxt:
  enabled: true
  # Skip long entries if NXT pre-market is down more than this vs prev close.
  # -0.01 = -1%. Leave positive (e.g. 0.0) to block neutral pre-markets too.
  bearish_threshold_pct: -0.01

investor_flow:
  enabled: true
  lookback_days: 3          # 최근 3거래일 외국인·기관 순매수 합산
  # require_smart_money: true 이면 외국인+기관 둘 다 순매도일 때 진입 차단
  # false 이면 로그만 출력 (advisory), 진입은 허용
  require_smart_money: false

# ---------------------------------------------------------------------------
# S&P 500 선물 실시간 방향 모니터
#
# 장 중 ES=F(E-mini S&P 500) 선물을 check_interval_seconds마다 조회해
# 세션 시작 대비 bearish_threshold 이상 하락하면 신규 진입을 막는다.
# yfinance 설치 필요: pip install yfinance
# ---------------------------------------------------------------------------
us_market:
  enabled: true
  symbol: "ES=F"                 # E-mini S&P 500 선물 (Yahoo Finance 티커)
  check_interval_seconds: 300    # 5분마다 조회
  bearish_threshold: -0.005      # -0.5% 이상 하락 시 진입 차단

# ---------------------------------------------------------------------------
# DART 전자공시 실시간 모니터
#
# https://opendart.fss.or.kr/ 에서 무료 API키 발급 후 .env에 추가:
#   DART_API_KEY=발급받은키
# 유니버스 종목의 계약·실적 공시는 진입 우선, CB·유상증자 공시는 진입 차단
# ---------------------------------------------------------------------------
dart:
  enabled: false                 # DART_API_KEY 설정 후 true로 변경
  poll_interval_seconds: 60      # 1분마다 신규 공시 체크
  boost_duration_minutes: 30     # 긍정 공시 후 30분간 진입 우선
  entry_relax_pct: 0.2           # 부스트 활성 중엔 진입 조건(거래량배수/봉강도/눌림폭) 20% 완화

# ---------------------------------------------------------------------------
# 트럼프 관련 뉴스 모니터 (구글 뉴스 RSS, API키 불필요)
#
# '트럼프' + 산업 키워드(관세·반도체·방산 등)가 함께 나오는 헤드라인을 감지해
# 텔레그램으로 알린다. 사용자 요청으로 실제 진입 조건에도 반영된다 -- 테마
# 매칭 종목은 부스트 지속시간 동안 entry_relax_pct만큼 조건이 완화된다.
# 발언과 개별 종목의 실제 반응 사이엔 확실한 인과관계가 없다는 점은 여전해서,
# 진입을 아예 막거나 강제로 걸지는 않고 기존 기술적 신호의 문턱만 낮춘다.
# ---------------------------------------------------------------------------
news:
  enabled: true
  query: "트럼프"
  poll_interval_seconds: 300     # 5분마다 체크
  boost_duration_minutes: 20     # 테마 매칭 시 진입 우선 부스트 지속시간
  entry_relax_pct: 0.2           # 부스트 활성 중엔 진입 조건(거래량배수/봉강도/눌림폭) 20% 완화

# ---------------------------------------------------------------------------
# 다중 시간프레임 확인 (일봉 추세 필터)
#
# 세션 시작 시 한 번, 종목별 일봉 EMA(기본 20일) 추세를 계산해 캐시한다.
# 일봉 자체가 하락 추세인 종목은 3분봉에서 아무리 좋은 신호가 나와도 매수
# 진입을 막는다. 일봉 데이터가 없으면 막지 않는다(advisory 기본 통과).
# ---------------------------------------------------------------------------
daily_trend:
  enabled: true
  ema_period: 20

# ---------------------------------------------------------------------------
# 실시간 호가 불균형 (매수/매도 잔량비)
#
# ka10004(주식호가요청)로 진입 직전 매수/매도 10차 잔량 합계를 비교한다.
# require_confirm: false 이면 로그만 남기고 진입은 막지 않는다(참고용).
# 며칠 지켜보고 잔량비가 실제로 쓸만한 신호로 보이면 true로 올려서
# min_ask_bid_ratio 미만일 때 진입을 실제로 차단하게 한다.
# ---------------------------------------------------------------------------
order_execution:
  # 수수료/슬리피지 방지 주문 최적화 (2026-08-27, 사용자 요청): 시장가 대신
  # 최우선호가(매수는 매도1호가, 매도는 매수1호가)에서 limit_buffer_ticks만큼
  # 더 부른 지정가(marketable limit)로 주문한다 -- 시장가처럼 즉시 체결될
  # 만큼 공격적이면서도, 최악의 체결가에 상한을 둔다. 호가 데이터가 없으면
  # (조회 실패 등) 그냥 시장가로 보낸다 -- fail-open, 주문 자체를 막지 않음.
  # 손절(하드스탑 + 전략 자체 stop_pct)과 시간강제청산(force_exit_at)은
  # 반드시 체결돼야 하므로 이 대상에서 제외하고 그대로 시장가를 쓴다.
  use_limit_orders: true
  limit_buffer_ticks: 2

orderbook:
  enabled: true
  require_confirm: false
  # 매수잔량 우위 -> 매도잔량 우위 판단으로 전환 (2026-08-27, 사용자 요청):
  # 매수벽이 두꺼운 게 아니라, 매도잔량이 매수잔량보다 이 배수 이상 많아야
  # (매수세가 매도벽을 실제로 먹어치우는 중이라는 뜻) 통과시킨다 -- 두꺼운
  # 매수벽은 허매수 받치기 후 물량 털기일 수 있다는 우려 반영.
  min_ask_bid_ratio: 2.0   # require_confirm: true 시 매도잔량/매수잔량 >= 2.0

execution_strength:
  enabled: true
  require_confirm: false
  min_strength: 100.0   # 체결강도 100 = 매수/매도 체결량 균형 (require_confirm: true 시 기준)

volatility_filter:
  # 거래량과 변동성이 죽은 횡보장에서는 진입 신호가 나와도 매매하지 않는다
  # (2026-08-27, 사용자 요청) -- 전략 조건이 기술적으로 맞아도 수수료만 나가는
  # 헛매매 방지. 청산에는 전혀 영향 없음, 신규 진입만 막는다. 위 orderbook/
  # execution_strength와 달리 처음부터 실제로 막는다(require_confirm 없음) --
  # 사용자가 명시적으로 "매매하지 않도록 제한"이라고 요청했다. 부담스러우면
  # enabled: false로 끄면 된다.
  enabled: true
  atr_period: 14
  min_atr_pct: 0.004        # 14봉 ATR이 현재가의 0.4% 미만이면 "변동성 죽음"
  volume_lookback: 20       # 기준 평균 거래량 계산 구간(봉)
  recent_bars: 5            # 최근 이 구간의 평균을 기준과 비교
  min_volume_ratio: 0.4     # 최근 평균이 기준 대비 40% 미만이면 "거래량 죽음"

screener:
  enabled: true
  n_stocks: 12              # max dynamic stocks to add per session -- now the
                             # ONLY source of the universe (static core disabled)
  markets: ["KOSDAQ", "KOSPI"]
  min_price: 3000           # skip sub-3000 KRW stocks (wide spreads)
  max_price: 40000          # skip stocks above 4만원 (afford 10+ shares with current capital)
  min_atr_pct: 0.015        # 1.5% daily ATR minimum (cost gate still applies)
  min_trading_value_m: 500  # 500억 KRW daily trading value minimum (more picks)
  refresh_interval_minutes: 10  # 장중 10분마다 순위 재스캔 → 핫 종목으로 자동 교체 (pykrx 데이터 늦게 채워질 때 더 빨리 감지)
  require_uptrend: true     # 일봉 종가가 EMA(daily_trend.ema_period) 위인 종목만 후보로 (변동성만 크고 하락 중인 종목 제외)

macro_gauge:
  # 미국증시(S&P500)/WTI유/미국10년물금리/비트코인/달러지수 -- 사용자 정의로
  # 다섯 다 "상승 = 강세"로 취급한다 (실제 매크로 상관관계는 더 복잡하지만,
  # 명시적으로 이렇게 정의했다). 세션 시작 시 하루 한 번만 조회.
  enabled: true
  bullish_threshold: 4        # 5개 중 이 개수 이상 상승이면 "강세장(공격 모드)"
  entry_relax_pct: 0.15       # 강세일 때 진입 조건(거래량배수/봉강도/눌림폭) 15% 완화
  extra_positions: 1          # 강세일 때 동시 보유 종목 수 +1 (기본 6 -> 7)
  risk_pct_boost: 1.2         # 강세일 때 종목당 리스크 배수 (1% -> 1.2%)

telegram:
  # Rule 12: dry-run by default. A missing token prints a preview, not an error.
  # Set dry_run: false and add TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID to .env to enable.
  dry_run: false
  poll_interval_seconds: 3   # how often to poll for commands (/status, /stop, etc.)
  parse_mode: Markdown

live_banner:
  countdown_seconds: 10

paths:
  trades_csv: trades.csv
  daily_pnl_csv: daily_pnl.csv
  state_file: state.json
  log_file: logs/bot.log
  cache_dir: data/cache
