# ---------------------------------------------------------------------------
# KRX trading bot — configuration
#
# Nothing secret lives here. App keys and tokens are read from .env only.
# ---------------------------------------------------------------------------

account:
  # Used by the dry-run broker and as the backtest starting equity (KRW).
  starting_equity: 10000000
  currency: KRW

risk:
  # Rule 4: every trade risks exactly this fraction of *current* equity.
  per_trade_pct: 0.01
  # Portfolio-wide caps. 1% x 8 stocks would put 8% at risk at once; these
  # hold total exposure to 6% across at most 6 open positions.
  max_total_risk_pct: 0.06
  max_open_positions: 6
  # Rule 5: peak-to-trough equity drawdown that trips the kill switch.
  max_drawdown_pct: 0.10
  atr_period: 14
  # Hard stop distance in ATR multiples. 1.0 => a 1-ATR adverse move loses
  # exactly per_trade_pct of equity.
  hard_stop_atr_mult: 1.0
  # Never let a single position exceed this share of equity in notional terms.
  max_position_notional_pct: 0.25
  # Retail short selling of KRX equities is not practically available, and
  # futures (including the futures inside inverse ETFs) are out of scope.
  # A short signal therefore closes a position but never opens one.
  long_only: true
  theme_filter:
    enabled: true

# Two stocks in one theme are one thesis sized twice, so only one position per
# theme is allowed at a time. Single-member themes never block anything.
themes:
  construction: ["002990", "228340"]      # 금호건설, 동양파일 (건설 + PHC파일)
  # 금호타이어 shares a name with 금호건설 but not an owner: it was sold to
  # Doublestar in 2018. Tyres track the auto cycle, construction does not, so
  # they are deliberately separate themes.
  auto_parts: ["073240"]                  # 금호타이어
  power_energy: ["006340", "009830"]      # 대원전선, 한화솔루션
  battery_materials: ["093370"]           # 후성
  shipbuilding: ["460930"]                # 현대힘스
  robotics: ["439960"]                    # 코스모로보틱스
  game: ["101730"]                        # 위메이드맥스

# ---------------------------------------------------------------------------
# Universe
#
# `name` and `market` are for display and for tax/tick selection. Run
# `python main.py profile` with network access to verify them against the
# official listing data — a wrong `market` mis-prices the transaction tax.
# ---------------------------------------------------------------------------
universe:
  "009830":
    name: 한화솔루션
    market: KOSPI
    enabled: true
    strategy: trend_following
    timeframe: 1Day
    min_qty: 1
    params:
      fast_ema: 50
      slow_ema: 200
      atr_trail_mult: 3.0

  "002990":
    name: 금호건설
    market: KOSPI
    enabled: true
    strategy: trend_following
    timeframe: 1Day
    min_qty: 1
    params:
      fast_ema: 50
      slow_ema: 200
      atr_trail_mult: 3.0

  "093370":
    name: 후성
    market: KOSPI
    enabled: true
    strategy: trend_following
    timeframe: 1Day
    min_qty: 1
    params:
      fast_ema: 50
      slow_ema: 200
      atr_trail_mult: 3.0

  "006340":
    name: 대원전선
    market: KOSPI
    enabled: true
    strategy: trend_following
    timeframe: 1Day
    min_qty: 1
    params:
      fast_ema: 50
      slow_ema: 200
      atr_trail_mult: 3.0

  "460930":
    name: 현대힘스
    market: KOSDAQ
    enabled: true
    strategy: breakout
    timeframe: 60Min
    min_qty: 1
    params:
      period: 20
      volume_mult: 1.5
      atr_trail_mult: 2.0

  "101730":
    name: 위메이드맥스
    market: KOSDAQ
    enabled: true
    strategy: breakout
    timeframe: 60Min
    min_qty: 1
    params:
      period: 20
      volume_mult: 1.5
      atr_trail_mult: 2.0

  "228340":
    name: 동양파일
    market: KOSDAQ
    enabled: true
    strategy: breakout
    timeframe: 60Min
    min_qty: 1
    params:
      period: 20
      volume_mult: 1.5
      atr_trail_mult: 2.0

  "073240":
    name: 금호타이어
    market: KOSPI
    enabled: true
    # Added to bring an existing holding under stop management. Verify the
    # market tag with `python main.py profile` -- a wrong one mis-prices tax.
    strategy: trend_following
    timeframe: 1Day
    min_qty: 1
    params:
      fast_ema: 50
      slow_ema: 200
      atr_trail_mult: 3.0

  "439960":
    name: 코스모로보틱스
    market: KOSDAQ
    enabled: true
    # Listed 2026-05-11. With only ~3 months of history a 200-period lookback
    # cannot warm up, so this one runs shortened parameters until enough bars
    # accumulate. Revisit once it has a year of trading behind it.
    listed_on: "2026-05-11"
    strategy: breakout
    timeframe: 60Min
    min_qty: 1
    params:
      period: 10
      volume_mult: 1.5
      atr_trail_mult: 2.0

# ---------------------------------------------------------------------------
# KRX market rules
# ---------------------------------------------------------------------------
krx:
  # Daily price limit. At the limit there is no counterparty, so orders are
  # skipped rather than assumed filled.
  price_limit_pct: 0.30

  # Quote grid. VERIFY against the current KRX rulebook — these have been
  # revised before, and a stale ladder silently mis-prices every stop.
  tick_ladder:
    KOSPI:
      - {below: 2000, tick: 1}
      - {below: 5000, tick: 5}
      - {below: 20000, tick: 10}
      - {below: 50000, tick: 50}
      - {below: 200000, tick: 100}
      - {below: 500000, tick: 500}
      - {below: inf, tick: 1000}
    KOSDAQ:
      - {below: 2000, tick: 1}
      - {below: 5000, tick: 5}
      - {below: 20000, tick: 10}
      - {below: 50000, tick: 50}
      - {below: inf, tick: 100}

  # Non-trading weekdays. Weekends are excluded automatically; Korean public
  # holidays, substitute holidays and ad-hoc closures cannot be derived from a
  # rule and must be listed here. Refresh with:
  #     python main.py profile --refresh-calendar
  holidays: []

# ---------------------------------------------------------------------------
# Rule 11: cost assumptions live here and print with every result set.
#
# Unlike a US venue, the SELL side pays transaction tax on top of commission.
# VERIFY the current rates before trading — they have been cut in stages.
# ---------------------------------------------------------------------------
costs:
  commission_bps: 1.5          # broker commission, per side
  sell_tax_bps:                # transaction tax, SELL side only
    KOSPI: 15.0
    KOSDAQ: 15.0
  slippage_bps: 10.0           # small/mid caps slip more than index ETFs

# ---------------------------------------------------------------------------
# Kiwoom REST API
#
# Paths and api-id codes. VERIFY against https://openapi.kiwoom.com/ and the
# official examples before live trading.
# ---------------------------------------------------------------------------
kiwoom:
  endpoints: {}                # override DEFAULT_ENDPOINTS in broker.py
  api_ids: {}                  # override DEFAULT_API_IDS in broker.py

api:
  max_retries: 5
  backoff_base_seconds: 2.0
  backoff_max_seconds: 60.0
  timeout_seconds: 10.0
  # Kiwoom throttles TR calls, so requests are serialised at this rate.
  calls_per_second: 4.0

schedule:
  # How often the outer loop wakes to see which strategies are due.
  tick_seconds: 30
  intervals:
    60Min: 3600
    1Day: 86400
  # How long to sleep when KRX is closed before re-checking.
  closed_market_sleep_seconds: 300

backtest:
  default_months: 6
  # Rule 10: fills happen on the bar *after* the signal bar.
  fill_delay_bars: 1
  respect_price_limits: true

telegram:
  # Rule 12: dry-run by default. A missing token prints a preview, not an error.
  dry_run: true
  parse_mode: Markdown

live_banner:
  countdown_seconds: 10

paths:
  trades_csv: trades.csv
  daily_pnl_csv: daily_pnl.csv
  state_file: state.json
  log_file: logs/bot.log
  cache_dir: data/cache
